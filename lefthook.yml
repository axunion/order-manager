pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "**/*.{js,ts,jsx,tsx,astro,json,jsonc}"
      run: pnpm biome check --write {staged_files}
      stage_fixed: true
    - name: typecheck
      glob: "**/*.{ts,tsx,astro}"
      run: pnpm astro check
    - name: test
      glob: "**/*.{ts,tsx}"
      run: pnpm test
